[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-data-scientist"
version = "0.1.0"
description = "A multi-agent AI system that turns a business question into SQL, analysis, ML and an executive report."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Suman Kumar" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
